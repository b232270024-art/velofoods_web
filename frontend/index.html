  <!-- Нүүр хуудасны hero хэсэгт шууд харагдах зургуудыг эхэрт preload хийнэ —
       эс бөгөөс эдгээр зураг зөвхөн React JS bundle бүрэн ачаалагдаж,
       ажиллаж, render хийсний ДАРАА л татагдаж эхэлдэг байсан тул анх
       нээх үед хоосон харагдах хугацаа урт байв. -->
  <link rel="preload" as="image" href="/images/hero-bg.webp" />
  <link rel="preload" as="image" href="/images/1.webp" />
  <link rel="preload" as="image" href="/images/2.webp" />
  <script>
    // Set the theme before first paint so there's no flash of the wrong
    // theme while React loads. Same resolution logic as lib/useTheme.js.
    (function () {
      try {
        var saved = localStorage.getItem('velofoods_theme');
        var theme = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      } catch (e) { /* ignore */ }
    })();
  </script>
